$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
command: >-
  python main.py --config ${inputs.config} --paths ${inputs.paths}
code: ..
environment:
  conda_file: azure/environment.yml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
inputs:
  config:
    type: uri_file
  paths:
    type: uri_file
outputs:
  model_output:
    type: uri_folder
  plots_output:
    type: uri_folder
resources:
  instance_count: 1
compute: azureml:cpu-cluster
experiment_name: mlp_ma_training
